name: Release

# Triggers on any `v*` tag push (typically `git tag v1.2.3 && git push --tags`).
# A manual workflow_dispatch is also wired in so we can re-run a publish
# without recreating the tag, useful when GHCR or a runner has a flake.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.2.3). Required when dispatched manually.'
        required: true

# Lets the workflow push images to GHCR under the same owner as the repo
# without configuring a PAT. `contents: read` is implicit but spelled out
# for clarity.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & publish container image
    runs-on: ubuntu-latest
    env:
      # ghcr.io/<owner>/<repo> in lowercase. `github.repository` already
      # contains both halves; we just lowercase it so users with mixed-
      # case org names still get a valid OCI reference.
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Resolve the tag we're publishing. For tag pushes,
          # `github.ref_name` is the tag; for manual runs, the user
          # supplies it via the input.
          ref: ${{ inputs.tag || github.ref_name }}

      # QEMU + Buildx together unlock multi-arch builds on a single
      # ubuntu-latest runner. arm64 runs slower under emulation, but
      # the alternative (matrixing across native runners) is more
      # plumbing than it's worth for a small Go service.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action turns the tag (e.g. `v1.2.3`) into the full set
      # of conventional Docker tags: `1.2.3`, `1.2`, `1`, plus `latest`
      # for the most recent stable. Pre-release tags (e.g. `v1.2.3-rc1`)
      # only get the exact-version tag and do NOT update `latest`.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=MountPad
            org.opencontainers.image.description=Self-hosted file workspace with per-mount ACLs.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # The VERSION build-arg lands in the Go binary via -ldflags so
      # the status bar in the running app shows the same tag this image
      # was built from. We strip the leading `v` to match the convention
      # the metadata-action follows for the image tags themselves.
      - name: Compute build version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # `prod` is the publishable image; the `dev` stage in the
          # same Dockerfile is for local hot-reload only.
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # Use the GitHub Actions cache backend so the heaviest layers
          # (Go module download, frontend npm install, frontend build)
          # survive across runs. `mode=max` writes every intermediate
          # layer, not just the final one.
          cache-from: type=gha
          cache-to: type=gha,mode=max
