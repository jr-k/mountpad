services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mountpad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password required}
      POSTGRES_DB: ${POSTGRES_DB:-mountpad}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mountpad}"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOUNTPAD_ENV: prod
      MOUNTPAD_APP_NAME: ${MOUNTPAD_APP_NAME:-MountPad}
      MOUNTPAD_HTTP_ADDR: ":4499"
      MOUNTPAD_PUBLIC_URL: ${MOUNTPAD_PUBLIC_URL:-https://mountpad.local}
      MOUNTPAD_SESSION_SECRET: ${MOUNTPAD_SESSION_SECRET:?session secret required}
      MOUNTPAD_COOKIE_SECURE: "true"
      MOUNTPAD_SAFE_MODE: ${MOUNTPAD_SAFE_MODE:-false}
      DB_DRIVER: postgres
      DB_DSN: postgres://${POSTGRES_USER:-mountpad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mountpad}?sslmode=disable
    ports:
      - "4499:4499"
    volumes:
      - ${STORAGE_HOST_PATH:-./examples/storage}:/storage

volumes:
  postgres-data:
